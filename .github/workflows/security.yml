name: Security
on:
    push:
    pull_request:
    schedule:
        - cron: '0 22 * * 0'
permissions:
    contents: read
jobs:
    security:
        name: Dependency Security
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - name: Scan First-Party Secrets
              run: GOTOOLCHAIN=go1.24.11 go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --redact --no-banner .
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: '24.22.0'
            - name: Audit Locked Dependencies
              run: npm audit --package-lock-only
